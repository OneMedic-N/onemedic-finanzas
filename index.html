<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OneMedic · Finanzas</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --teal:#3B9BA7;--teal-dk:#2A7A85;--teal-lt:#EBF7F9;--teal-bd:#BDE0E5;
  --navy:#0D2137;--rojo:#E53945;--rojo-lt:#FEF0F0;
  --verde:#27AE60;--verde-lt:#EAF8EF;--verde-bd:#A8DDB8;
  --azul:#2980B9;
  --bg:#F4F6F8;--white:#fff;
  --txt:#1F2937;--txt2:#6B7280;--txt3:#9CA3AF;
  --brd:#E5E7EB;--brd2:#D1D5DB;
  --shadow:0 1px 4px rgba(0,0,0,0.08);
}
body{background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--txt);min-height:100vh}

.topbar{background:var(--navy);position:sticky;top:0;z-index:100}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;padding:12px 16px}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{width:32px;height:32px;background:var(--teal);border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-icon svg{width:18px;height:18px}
.brand-name{font-size:17px;font-weight:700;color:white;letter-spacing:-0.3px}
.brand-sub{font-size:10px;color:rgba(255,255,255,0.45);margin-top:1px}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#27AE60;flex-shrink:0}
.sync-dot.loading{background:#F59E0B;animation:pulse 1s infinite}
.sync-dot.error{background:var(--rojo)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.teal-bar{height:2.5px;background:var(--teal)}
.tabs{display:flex;background:var(--navy);padding:0 16px;border-top:1px solid rgba(255,255,255,0.06)}
.tab{flex:1;padding:11px 4px;font-size:12px;font-weight:500;color:rgba(255,255,255,0.4);text-align:center;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s}
.tab.on{color:var(--teal);border-bottom-color:var(--teal)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px 16px 8px}
.card{background:var(--white);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.card-lbl{font-size:11px;color:var(--txt3);font-weight:500;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.card-val{font-size:22px;font-weight:700;color:var(--txt);letter-spacing:-.5px}
.card-val.pos{color:var(--verde)}
.card-val.neg{color:var(--rojo)}
.card-val.zero{color:var(--txt2)}

.pane{padding:8px 16px 100px}
.form-box{background:var(--white);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:10px}
.type-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.ttype{padding:11px;border-radius:10px;border:1.5px solid var(--brd);background:var(--white);font-size:14px;font-weight:500;color:var(--txt2);cursor:pointer;text-align:center;transition:all .15s}
.ttype.ing.on{background:var(--verde-lt);border-color:var(--verde);color:var(--verde)}
.ttype.gas.on{background:var(--rojo-lt);border-color:var(--rojo);color:var(--rojo)}

.field{margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:11px;font-weight:600;color:var(--txt2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--brd);border-radius:10px;font-size:15px;color:var(--txt);background:var(--white);-webkit-appearance:none;outline:none;font-family:inherit;transition:border-color .15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(59,155,167,.12)}
.field input[type=number]{font-size:18px;font-weight:700}
.field textarea{resize:none;height:72px;line-height:1.5}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

.pay-btn{padding:11px 4px;border-radius:10px;border:1.5px solid var(--brd);background:var(--white);font-size:13px;font-weight:500;color:var(--txt2);cursor:pointer;text-align:center;transition:all .15s}
.pay-btn.on{background:var(--teal-lt);border-color:var(--teal);color:var(--teal-dk)}

.para-pills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px}
.para-pill{padding:7px 14px;border-radius:20px;border:1.5px solid var(--brd);background:var(--white);font-size:13px;color:var(--txt2);cursor:pointer;transition:all .15s}
.para-pill.on{background:var(--verde-lt);border-color:var(--verde);color:var(--verde);font-weight:500}
.add-row{display:flex;gap:8px;margin-top:4px}
.add-row input{flex:1;padding:10px 14px;border:1.5px solid var(--brd);border-radius:10px;font-size:14px;color:var(--txt);background:var(--white);-webkit-appearance:none;outline:none;font-family:inherit}
.add-row input:focus{border-color:var(--teal)}
.add-row button{padding:10px 14px;border-radius:10px;border:none;background:var(--teal);color:white;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}

.btn-primary{width:100%;padding:15px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;letter-spacing:-.2px;transition:all .15s;background:var(--rojo);color:white;position:relative}
.btn-primary.ing{background:var(--verde)}
.btn-primary:active{opacity:.88;transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none}

.list-box{background:var(--white);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--brd);flex-wrap:wrap;gap:8px}
.list-head span{font-size:13px;font-weight:600}
.fil-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fpill{padding:5px 12px;border-radius:20px;border:1px solid var(--brd);background:var(--white);font-size:12px;color:var(--txt2);cursor:pointer;transition:all .15s}
.fpill.on{background:var(--teal);border-color:var(--teal);color:white}
.fil-sel{font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--brd);background:var(--white);color:var(--txt2);-webkit-appearance:none;outline:none}

.entry{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--brd)}
.entry:last-child{border-bottom:none}
.entry-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.entry-dot.i{background:var(--verde)}
.entry-dot.g{background:var(--rojo)}
.entry-info{flex:1;min-width:0}
.entry-top{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-sub{font-size:11px;color:var(--txt3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry-right{text-align:right;flex-shrink:0}
.entry-monto{font-size:15px;font-weight:700}
.entry-monto.i{color:var(--verde)}
.entry-monto.g{color:var(--rojo)}
.entry-del{font-size:10px;color:var(--txt3);cursor:pointer;margin-top:3px;display:block;background:none;border:none;padding:0;font-family:inherit}
.entry-del:hover{color:var(--rojo)}

.empty-st{padding:40px 20px;text-align:center;color:var(--txt3);font-size:14px}

.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.chart-box{background:var(--white);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.chart-title{font-size:12px;font-weight:600;color:var(--txt);margin-bottom:10px}
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-lbl{font-size:11px;color:var(--txt2);width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-bg{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar-fi{height:100%;border-radius:4px;transition:width .3s}
.bc-ing{background:var(--verde)}
.bc-gas{background:var(--rojo)}
.bc-pago{background:var(--azul)}
.bc-para{background:#7F77DD}
.bar-val{font-size:11px;font-weight:600;color:var(--txt);width:62px;text-align:right;flex-shrink:0}

.stat-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:8px}
.stat-box{background:var(--white);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat-n{font-size:20px;font-weight:700;color:var(--teal)}
.stat-l{font-size:10px;color:var(--txt3);margin-top:2px;text-transform:uppercase;letter-spacing:.05em}

.insight{background:var(--teal-lt);border:1px solid var(--teal-bd);border-radius:12px;padding:14px 16px;margin-bottom:8px;font-size:13px;color:var(--teal-dk);line-height:1.8}
.insight strong{color:var(--navy)}

.export-btn{width:100%;padding:13px;background:var(--white);color:var(--txt2);border:1.5px solid var(--brd2);border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;margin-bottom:8px}
.export-btn:active{background:var(--bg)}
.del-all{color:var(--rojo);border-color:var(--rojo-lt)}

.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.4);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}

.loading-overlay{text-align:center;padding:30px;color:var(--txt3);font-size:13px}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:#1F2937;color:white;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;z-index:300;white-space:nowrap;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none">
          <rect x="10" y="3" width="4" height="18" rx="2" fill="white"/>
          <rect x="3" y="10" width="18" height="4" rx="2" fill="white"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">OneMedic</div>
        <div class="brand-sub">Registro compartido de finanzas</div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:8px">
      <span style="font-size:10px;color:rgba(255,255,255,0.4)" id="sync-lbl">Cargando...</span>
      <div class="sync-dot loading" id="sync-dot"></div>
    </div>
  </div>
  <div class="teal-bar"></div>
  <div class="tabs">
    <div class="tab on" onclick="setTab('reg',this)">Registrar</div>
    <div class="tab" onclick="setTab('mov',this)">Movimientos</div>
    <div class="tab" onclick="setTab('res',this)">Resumen</div>
  </div>
</div>

<div class="cards">
  <div class="card"><div class="card-lbl">Ingresos</div><div class="card-val pos" id="ki">$0</div></div>
  <div class="card"><div class="card-lbl">Gastos</div><div class="card-val neg" id="kg">$0</div></div>
  <div class="card"><div class="card-lbl">Balance</div><div class="card-val zero" id="kb">$0</div></div>
  <div class="card"><div class="card-lbl">Registros</div><div class="card-val zero" id="kn">0</div></div>
</div>

<!-- REGISTRAR -->
<div class="pane" id="pane-reg">
  <div class="form-box">
    <div class="type-row">
      <button class="ttype ing on" id="btn-ing" onclick="setTipo('ingreso')">+ Ingreso</button>
      <button class="ttype gas" id="btn-gas" onclick="setTipo('gasto')">− Gasto</button>
    </div>
    <div class="field">
      <label>Paramédico</label>
      <div class="para-pills" id="para-pills"></div>
      <div class="add-row">
        <input type="text" id="new-para" placeholder="Nombre del paramédico...">
        <button onclick="addParamedico()">Agregar</button>
      </div>
    </div>
    <div class="row2">
      <div class="field"><label>Fecha</label><input type="date" id="f-fecha"></div>
      <div class="field"><label>Monto $</label><input type="number" id="f-monto" placeholder="0.00" inputmode="decimal" min="0" step="0.01"></div>
    </div>
    <div class="field"><label>Categoría</label><select id="f-cat"></select></div>
    <div class="field">
      <label>Forma de pago</label>
      <div class="row3">
        <button class="pay-btn on" onclick="setPago('Efectivo',this)">Efectivo</button>
        <button class="pay-btn" onclick="setPago('Tarjeta',this)">Tarjeta</button>
        <button class="pay-btn" onclick="setPago('Transferencia',this)">Transferencia</button>
      </div>
    </div>
    <div class="field"><label>Concepto</label><input type="text" id="f-concepto" placeholder="ej. Traslado CDMX–Tampico" autocomplete="off"></div>
    <div class="field"><label>Cliente / proveedor</label><input type="text" id="f-cliente" placeholder="ej. Hospital Ángeles" autocomplete="off"></div>
    <div class="field"><label>Notas</label><textarea id="f-notas" placeholder="Observaciones..."></textarea></div>
  </div>
  <button class="btn-primary" id="btn-save" onclick="addEntry()">Guardar movimiento</button>
</div>

<!-- MOVIMIENTOS -->
<div class="pane" id="pane-mov" style="display:none">
  <div class="list-box">
    <div class="list-head">
      <span id="list-cnt">0 registros</span>
      <div class="fil-row">
        <button class="fpill on" onclick="setFil('',this)">Todos</button>
        <button class="fpill" onclick="setFil('ingreso',this)">Ingresos</button>
        <button class="fpill" onclick="setFil('gasto',this)">Gastos</button>
        <select class="fil-sel" id="fil-para" onchange="renderList()">
          <option value="">Todos</option>
        </select>
        <button class="fpill" style="background:var(--teal-lt);border-color:var(--teal-bd);color:var(--teal-dk)" onclick="exportCSV()">CSV</button>
        <button class="fpill" style="background:var(--teal-lt);border-color:var(--teal-bd);color:var(--teal-dk)" onclick="loadData()">↻</button>
      </div>
    </div>
    <div id="list-body"></div>
  </div>
</div>

<!-- RESUMEN -->
<div class="pane" id="pane-res" style="display:none">
  <div class="stat-grid">
    <div class="stat-box"><div class="stat-n" id="s-ing">$0</div><div class="stat-l">Ingresos</div></div>
    <div class="stat-box"><div class="stat-n" id="s-gas" style="color:var(--rojo)">$0</div><div class="stat-l">Gastos</div></div>
    <div class="stat-box"><div class="stat-n" id="s-mar">0%</div><div class="stat-l">Margen</div></div>
  </div>
  <div class="res-grid">
    <div class="chart-box"><div class="chart-title">Ingresos por categoría</div><div id="bars-ing"></div></div>
    <div class="chart-box"><div class="chart-title">Gastos por categoría</div><div id="bars-gas"></div></div>
  </div>
  <div class="res-grid">
    <div class="chart-box"><div class="chart-title">Forma de pago</div><div id="bars-pago"></div></div>
    <div class="chart-box"><div class="chart-title">Por paramédico</div><div id="bars-para"></div></div>
  </div>
  <div class="insight" id="insight">Cargando datos...</div>
  <button class="export-btn" onclick="exportCSV()">Exportar a CSV (Excel)</button>
</div>

<div class="toast" id="toast"></div>

<script>
const CATS={
  ingreso:['Traslado Programado','Urgencia Médica','UCI Móvil ALS','Paramédico en Moto','Paramédico a Pie','Cobertura de Eventos','Convenio Hospital','Convenio Aseguradora','Convenio Corporativo','Traslado Foráneo','Otro ingreso'],
  gasto:['Nómina / Personal','Combustible','Mantenimiento Vehículo','Medicamentos y Suministros','Casetas / Peajes','Renta Oficina','Equipamiento Médico','Marketing y Publicidad','Seguros','Impuestos / IMSS','Servicios (tel/internet)','Viáticos','Otro gasto']
};
let tipo='ingreso',pago='Efectivo',paramedico='',filtro='';
let data=[];
let paramedicos=[];
try{paramedicos=JSON.parse(localStorage.getItem('om_paras')||'[]')}catch(e){}

function fmt(n){return'$'+Math.round(Math.abs(n)).toLocaleString('es-MX')}
function toast(msg,ok){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=ok===false?'var(--rojo)':'#1F2937';
  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400);
}
function setSyncState(state){
  const dot=document.getElementById('sync-dot');
  const lbl=document.getElementById('sync-lbl');
  if(state==='ok'){dot.className='sync-dot';lbl.textContent='Sincronizado'}
  else if(state==='loading'){dot.className='sync-dot loading';lbl.textContent='Sincronizando...'}
  else{dot.className='sync-dot error';lbl.textContent='Sin conexión'}
}

async function loadData(){
  setSyncState('loading');
  try{
    const res=await fetch('/api/data');
    if(!res.ok)throw new Error('Error '+res.status);
    data=await res.json();
    setSyncState('ok');
    updateKPIs();
    if(document.getElementById('pane-mov').style.display!=='none')renderList();
    if(document.getElementById('pane-res').style.display!=='none')renderResumen();
  }catch(e){
    setSyncState('error');
    toast('Sin conexión — reintentando...', false);
    setTimeout(loadData, 5000);
  }
}

async function addEntry(){
  const fecha=document.getElementById('f-fecha').value;
  const monto=parseFloat(document.getElementById('f-monto').value);
  if(!fecha){toast('Selecciona una fecha',false);return}
  if(!monto||monto<=0){toast('Ingresa un monto válido',false);return}
  if(!paramedico){toast('Selecciona un paramédico',false);return}
  const btn=document.getElementById('btn-save');
  btn.disabled=true;
  btn.innerHTML='<span class="spinner"></span> Guardando...';
  const entry={
    fecha,tipo,pago,paramedico,monto,
    cat:document.getElementById('f-cat').value,
    concepto:document.getElementById('f-concepto').value.trim()||document.getElementById('f-cat').value,
    cliente:document.getElementById('f-cliente').value.trim(),
    notas:document.getElementById('f-notas').value.trim()
  };
  try{
    const res=await fetch('/api/data',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(entry)
    });
    if(!res.ok)throw new Error('Error '+res.status);
    const saved=await res.json();
    data.unshift(saved);
    updateKPIs();
    ['f-monto','f-concepto','f-cliente','f-notas'].forEach(id=>document.getElementById(id).value='');
    toast(tipo==='ingreso'?'Ingreso guardado':'Gasto guardado');
  }catch(e){
    toast('Error al guardar — intenta de nuevo',false);
  }finally{
    btn.disabled=false;
    btn.innerHTML='Guardar movimiento';
  }
}

async function delEntry(id){
  if(!confirm('¿Eliminar este registro?'))return;
  try{
    await fetch('/api/data?id='+id,{method:'DELETE'});
    data=data.filter(d=>d.id!==id);
    updateKPIs();renderList();
    toast('Registro eliminado');
  }catch(e){
    toast('Error al eliminar',false);
  }
}

function setTipo(t){
  tipo=t;
  document.getElementById('btn-ing').className='ttype ing'+(t==='ingreso'?' on':'');
  document.getElementById('btn-gas').className='ttype gas'+(t==='gasto'?' on':'');
  document.getElementById('btn-save').className='btn-primary'+(t==='ingreso'?' ing':'');
  buildCats();
}
function setPago(p,btn){pago=p;document.querySelectorAll('.pay-btn').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function setParamedico(name,btn){paramedico=name;document.querySelectorAll('.para-pill').forEach(b=>b.classList.remove('on'));btn.classList.add('on')}
function addParamedico(){
  const inp=document.getElementById('new-para');
  const name=inp.value.trim();
  if(!name||paramedicos.includes(name))return;
  paramedicos.push(name);
  try{localStorage.setItem('om_paras',JSON.stringify(paramedicos))}catch(e){}
  inp.value='';buildParaPills();buildParaFilter();toast(name+' agregado');
}
function buildParaPills(){
  document.getElementById('para-pills').innerHTML=paramedicos.map(n=>
    `<button class="para-pill${paramedico===n?' on':''}" onclick="setParamedico('${n}',this)">${n}</button>`
  ).join('');
}
function buildParaFilter(){
  const sel=document.getElementById('fil-para');
  const cur=sel.value;sel.innerHTML='<option value="">Todos</option>';
  paramedicos.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;if(n===cur)o.selected=true;sel.appendChild(o)});
}
function buildCats(){
  const s=document.getElementById('f-cat');s.innerHTML='';
  CATS[tipo].forEach(c=>{const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o)});
}
function setTab(id,btn){
  ['reg','mov','res'].forEach(p=>document.getElementById('pane-'+p).style.display=p===id?'block':'none');
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('on'));btn.classList.add('on');
  if(id==='mov'){buildParaFilter();renderList();}
  if(id==='res')renderResumen();
}
function setFil(f,btn){filtro=f;document.querySelectorAll('.fpill').forEach(b=>b.classList.remove('on'));btn.classList.add('on');renderList()}
function updateKPIs(){
  const ing=data.filter(d=>d.tipo==='ingreso').reduce((a,d)=>a+d.monto,0);
  const gas=data.filter(d=>d.tipo==='gasto').reduce((a,d)=>a+d.monto,0);
  const bal=ing-gas;
  document.getElementById('ki').textContent=fmt(ing);
  document.getElementById('kg').textContent=fmt(gas);
  const kb=document.getElementById('kb');
  kb.textContent=fmt(bal);kb.className='card-val'+(bal>0?' pos':bal<0?' neg':' zero');
  document.getElementById('kn').textContent=data.length;
}
function renderList(){
  const fp=document.getElementById('fil-para').value;
  let rows=filtro?data.filter(d=>d.tipo===filtro):data;
  if(fp)rows=rows.filter(d=>d.paramedico===fp);
  document.getElementById('list-cnt').textContent=rows.length+' registros';
  const body=document.getElementById('list-body');
  if(!rows.length){body.innerHTML='<div class="empty-st">Sin movimientos registrados</div>';return}
  body.innerHTML=rows.map(d=>`
    <div class="entry">
      <div class="entry-dot ${d.tipo==='ingreso'?'i':'g'}"></div>
      <div class="entry-info">
        <div class="entry-top">${d.concepto}</div>
        <div class="entry-sub">${d.fecha} · ${d.pago||'—'} · ${d.paramedico||'—'}${d.cliente?' · '+d.cliente:''}</div>
      </div>
      <div class="entry-right">
        <div class="entry-monto ${d.tipo==='ingreso'?'i':'g'}">${d.tipo==='ingreso'?'+':'-'}${fmt(d.monto)}</div>
        <button class="entry-del" onclick="delEntry(${d.id})">Eliminar</button>
      </div>
    </div>
  `).join('');
}
function renderBars(id,entries,cls,key='cat'){
  const el=document.getElementById(id);
  if(!entries.length){el.innerHTML='<div style="font-size:12px;color:#9CA3AF;padding:4px 0">Sin datos</div>';return}
  const tot={};entries.forEach(d=>{const k=d[key]||'Sin asignar';tot[k]=(tot[k]||0)+d.monto});
  const max=Math.max(...Object.values(tot));
  el.innerHTML=Object.entries(tot).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-lbl">${k}</div>
      <div class="bar-bg"><div class="bar-fi ${cls}" style="width:${Math.round(v/max*100)}%"></div></div>
      <div class="bar-val">${fmt(v)}</div>
    </div>`).join('');
}
function renderResumen(){
  const ing=data.filter(d=>d.tipo==='ingreso');
  const gas=data.filter(d=>d.tipo==='gasto');
  const ti=ing.reduce((a,d)=>a+d.monto,0);
  const tg=gas.reduce((a,d)=>a+d.monto,0);
  const margin=ti>0?Math.round((ti-tg)/ti*100):0;
  document.getElementById('s-ing').textContent=fmt(ti);
  document.getElementById('s-gas').textContent=fmt(tg);
  const sm=document.getElementById('s-mar');
  sm.textContent=margin+'%';sm.style.color=margin>=0?'var(--verde)':'var(--rojo)';
  renderBars('bars-ing',ing,'bc-ing');
  renderBars('bars-gas',gas,'bc-gas');
  renderBars('bars-pago',ing,'bc-pago','pago');
  renderBars('bars-para',ing,'bc-para','paramedico');
  const pagTot={};ing.forEach(d=>{const k=d.pago||'Sin esp.';pagTot[k]=(pagTot[k]||0)+d.monto});
  const pagStr=Object.entries(pagTot).map(([k,v])=>`<strong>${k}</strong>: ${fmt(v)}`).join(' · ');
  const top=ing.slice().sort((a,b)=>b.monto-a.monto)[0];
  const topG=gas.slice().sort((a,b)=>b.monto-a.monto)[0];
  const paraTot={};ing.forEach(d=>{const k=d.paramedico||'Sin asignar';paraTot[k]=(paraTot[k]||0)+d.monto});
  const paraTop=Object.entries(paraTot).sort((a,b)=>b[1]-a[1])[0];
  document.getElementById('insight').innerHTML=data.length?`
    Balance: <strong>${fmt(ti-tg)}</strong> · Margen: <strong>${margin}%</strong><br>
    ${pagStr?'Cobros: '+pagStr+'<br>':''}
    ${paraTop?'Mayor captador: <strong>'+paraTop[0]+'</strong> ('+fmt(paraTop[1])+')<br>':''}
    ${top?'Ingreso mayor: <strong>'+top.concepto+'</strong> ('+fmt(top.monto)+')<br>':''}
    ${topG?'Gasto mayor: <strong>'+topG.cat+'</strong> ('+fmt(topG.monto)+')<br>':''}
    Total registros: <strong>${data.length}</strong>
  `:'Agrega movimientos para ver el análisis.';
}
function exportCSV(){
  if(!data.length){toast('No hay datos',false);return}
  const h='Fecha,Tipo,Paramédico,Forma de Pago,Categoría,Concepto,Cliente/Proveedor,Monto,Notas\n';
  const r=data.map(d=>`${d.fecha},${d.tipo},"${d.paramedico||''}","${d.pago||''}","${d.cat}","${d.concepto}","${d.cliente||''}",${d.monto},"${d.notas||''}"`).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob(['\uFEFF'+h+r],{type:'text/csv;charset=utf-8'}));
  a.download='OneMedic_Finanzas.csv';a.click();
  toast('CSV descargado');
}

// Init
document.getElementById('f-fecha').value=new Date().toISOString().split('T')[0];
buildCats();buildParaPills();buildParaFilter();
loadData();
// Auto-refresh every 30 seconds
setInterval(loadData, 30000);
</script>
